name: Discord Message Notify

on:
  push:
    branches: [ TD3_01 ]
  pull_request:
    branches: [ TD3_01 ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Discord Message Notify
      uses: appleboy/discord-action@0.0.3
      with:
        webhook_id: ${{ secrets.WEBHOOK_ID }}
        webhook_token: ${{ secrets.WEBHOOK_TOKEN }}
        color: "#48f442"
        username: "GitHub Bot"
        # メッセージ内容をカスタマイズ
        message: |
          **${{ github.actor }}** が `${{ github.ref_name }}` に **${{ github.event_name }}** を行いました。
          
          **リポジトリ:** ${{ github.repository }}
          **コミットメッセージ:** > ${{ github.event.head_commit.message || github.event.pull_request.title }}
          
          **詳細はこちら:**
          ${{ github.event.compare || github.event.pull_request.html_url }}